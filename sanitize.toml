[brand]
terms = ["STG", "Schmeisser", "Terra Gomes", "stglaw", "RenavePro", "Cipasa", "Verana", "Alvorá", "Alphaville", "Vívea", "LUAR DE", "Reserva Bonsucesso", "Bosque do Horto"]

[domains]
internal = ["stglaw.com.br", "stgadvogados.com.br"]

[hosts]
suffixes = ["vercel.app", "amazonaws.com", "tidbcloud.com"]

[allow]
# lock file, build output, rendered sample PDFs (binary; their text is the JSON fixtures)
paths = ["package-lock.json", "*.tsbuildinfo", "node_modules/*", "node_modules/**/*", ".next/*", ".next/**/*", "public/samples/*", ".demo/*", ".demo/**/*"]
# Fixture case numbers are dated 2099 (a year no real case can carry) and have invalid check
# digits; the lawyers' registrations use the non-existent state "ZZ" and all-zero numbers.
patterns = ['\d{7}-\d{2}\.2099\.\d\.\d{2}\.\d{4}', 'OAB/ZZ 000\.00\d']
